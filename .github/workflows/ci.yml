# Push / PR gate (LIBRARY_CONVENTIONS §5): npm ci → typecheck → build:types → test.
# No lint step (tsc with checkJs + strictNullChecks already catches the bug class that
# matters; the ESLint ecosystem cuts against the dependency hierarchy for a small vanilla-ESM
# lib). All tests are hermetic (own tmp fixtures, scripted stub providers) and token-free —
# the N0 exit discipline: the whole suite runs without an LLM anywhere.
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — the suite READS HISTORY. tests/close-stages.test.js proves its
      # one-population check can fail by diffing against the pre-split close source
      # (`git show f2be2b6:…`), and the default depth-1 clone does not have that object:
      # the guard skipped and reported `ok` on a run where twelve of its siblings failed.
      # The same must hold in publish.yml — a workflow fix belongs in EVERY workflow that
      # runs the failing step (the ripgrep install landed here only, and publish then
      # failed on the identical cause).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
      # litectx's impact() shells out to ripgrep (documented requirement; not on the runner
      # image). Without it a symbol reads as 0 callers and the two ctx_impact tests fail (LC-5).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - run: npm ci
      - run: npm run typecheck   # tsc --noEmit — JSDoc/code mismatch blocks merge (anti-drift, LIBRARY_CONVENTIONS §2)
      - run: npm run build:types # prove the .d.ts actually generate from the JSDoc
      - run: npm test            # node --test — hermetic, token-free
        env:
          # #2b (2026-08-27, hamr's word): supply the real pre-push range so
          # prompt-commit-check covers EVERY commit of a linear multi-commit
          # direct push to main, not just HEAD~1..HEAD (its local fallback).
          # Push events only — pull_request has no event.before; the script
          # ignores an empty value and falls back to --range origin/main..HEAD.
          PROMPT_COMMIT_RANGE: ${{ github.event_name == 'push' && format('{0}..{1}', github.event.before, github.sha) || '' }}
